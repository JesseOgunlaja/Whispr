services:
    website:
        image: ghcr.io/jesseogunlaja/whispr:latest
        env_file:
            - .env
        ports:
            - "80:3000"
        depends_on:
            - postgres
            - redis

    redis:
        image: redis:8.2-alpine
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
        volumes:
            - redis-db:/data

    postgres:
        image: ghcr.io/jesseogunlaja/whispr-postgres:latest
        container_name: postgres
        environment:
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        volumes:
            - postgres-data:/var/lib/postgresql/

volumes:
    postgres-data:
    redis-db:
